[workspace]
resolver = "2"
members = ["crates/trackmysign-core", "crates/trackmysign-cli", "crates/portal-bridge", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "trackmysign-desktop"
version = "0.6.0"
description = "TrackMy Sign — sign PDFs with your DSC token"
edition = "2024"

[lib]
name = "trackmysign_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Microsoft Store (MSIX) build, see packaging/msstore: no in-app updater, and
# the start at sign-in is the package's StartupTask.
store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"
portal-bridge = { path = "../../../crates/portal-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trackmysign-core = { path = "../../../crates/trackmysign-core" }
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSSharingService", "NSView"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
windows-collections = "0.3"

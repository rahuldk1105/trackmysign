[package]
name = "trackmysign-desktop"
version = "0.6.0"
description = "TrackMy Sign — sign PDFs with your DSC token"
edition = "2024"

[lib]
name = "trackmysign_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Microsoft Store (MSIX) build, see packaging/msstore: no in-app updater, and
# the start at sign-in is the package's StartupTask.
store = ["dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"
portal-bridge = { path = "../../../crates/portal-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trackmysign-core = { path = "../../../crates/trackmysign-core" }
zeroize = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["ApplicationModel", "ApplicationModel_Activation", "Win32_System_Com"] }

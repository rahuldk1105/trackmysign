[package]
name = "trackmysign-desktop"
version = "0.1.2"
description = "TrackMySign — sign PDFs with your DSC token"
authors = ["DK Rahul"]
edition = "2024"

[lib]
name = "trackmysign_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signdesk-core = { path = "../../../crates/signdesk-core" }

[package]
name = "trackmysign"
version = "0.5.0"
edition = "2024"
description = "TrackMy Sign command-line PDF signer"

[build-dependencies]
tauri-winres = "0.3"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "7"
rpassword = "7.5.4"
serde_json = "1"
trackmysign-core = { version = "0.5.0", path = "../trackmysign-core" }
zeroize = "1"

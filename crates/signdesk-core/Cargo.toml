[package]
name = "signdesk-core"
version = "0.1.4"
edition = "2024"

[dependencies]
chrono = "0.4"
cms = { version = "0.2.3", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }
cryptoki = "0.12.1"
der = { version = "0.7", features = ["derive", "oid", "alloc"] }
flate2 = "1.1.10"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0.21"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
x509-cert = "0.2"
x509-ocsp = "0.2.1"

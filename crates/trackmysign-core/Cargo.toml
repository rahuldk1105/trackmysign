[package]
name = "trackmysign-core"
version = "0.4.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chrono = "0.4"
cms = { version = "0.2.3", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }
cryptoki = "0.12.1"
cryptoki-sys = "0.5"
der = { version = "0.7", features = ["derive", "oid", "alloc"] }
flate2 = "1.1.10"
getrandom = "0.2"
md-5 = "0.10"
num-bigint = "0.4"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
png = "0.18"
rc4 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2.0.21"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
x509-cert = "0.2"
x509-ocsp = "0.2.1"

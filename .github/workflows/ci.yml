name: CI

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (virtual token)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc qpdf libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          sudo usermod -aG softhsm "$USER" || true
          pip install --break-system-packages pyhanko pyhanko-certvalidator reportlab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build -p signdesk
      - name: End-to-end signing tests
        run: sudo -E env "PATH=$PATH" tests/run.sh

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bin: signdesk.exe
            artifact: signdesk-windows-x64
          - name: macOS
            os: macos-latest
            bin: signdesk
            artifact: signdesk-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p signdesk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
      # Release assets don't count against the Actions artifact storage quota.
      - name: Publish to the "test-build" pre-release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}-${{ matrix.bin }}"
          gh release view test-build >/dev/null 2>&1 || \
            gh release create test-build --prerelease --target "$GITHUB_SHA" \
              --title "SignDesk test build" --notes "Latest build from ${GITHUB_REF_NAME}. For testing only."
          gh release upload test-build "${{ matrix.artifact }}-${{ matrix.bin }}" --clobber

  desktop:
    name: Desktop app ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            file: target/release/bundle/nsis/*.exe
            asset: SignDesk-Setup-windows-x64.exe
          - name: macOS
            os: macos-latest
            bundles: dmg
            file: target/release/bundle/dmg/*.dmg
            asset: SignDesk-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Developer ID signing + notarization, only once the secrets exist.
      - name: Enable Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Apple signing enabled"
          else
            echo "No Apple secrets set: building an unsigned app"
          fi
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Publish to the "test-build" pre-release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ${{ matrix.file }} "${{ matrix.asset }}"
          gh release view test-build >/dev/null 2>&1 || \
            gh release create test-build --prerelease --target "$GITHUB_SHA" \
              --title "SignDesk test build" --notes "Latest build from ${GITHUB_REF_NAME}. For testing only."
          gh release upload test-build "${{ matrix.asset }}" --clobber

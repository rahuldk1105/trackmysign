name: CI

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0). Leave empty for a test build."
        required: false
        default: ""

jobs:
  test:
    name: Test (virtual token)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc qpdf poppler-utils libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          sudo usermod -aG softhsm "$USER" || true
          pip install --break-system-packages pyhanko pyhanko-certvalidator reportlab jsonschema pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm ci && npm run build && npm test
      - name: winget manifests
        run: python3 -m unittest discover -s packaging/winget
      - name: Microsoft Store manifest
        run: python3 -m unittest discover -s packaging/msstore
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build -p trackmysign
      - run: cargo build -p portal-bridge --example portal-test-server
      - name: End-to-end signing tests
        run: sudo -E env "PATH=$PATH" PORTAL_TEST_SERVER="$PWD/target/debug/examples/portal-test-server" tests/run.sh

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bin: trackmysign.exe
            artifact: trackmysign-windows-x64.exe
          - name: macOS
            os: macos-latest
            bin: trackmysign
            artifact: trackmysign-macos-arm64
          # The oldest supported runner: a binary linked against its glibc
          # also runs on newer distributions, not the other way round.
          - name: Linux
            os: ubuntu-22.04
            bin: trackmysign
            artifact: trackmysign-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p trackmysign
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
      # Release assets don't count against the Actions artifact storage quota.
      # Tags (v1.2.3) publish a normal release, which /releases/latest points at;
      # other pushes refresh the "test-build" pre-release.
      - name: Publish release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash .github/release-notes.sh "${RELEASE_TAG:-$GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          if [[ -n "$RELEASE_TAG" ]]; then
            REL="$RELEASE_TAG"
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --target "$GITHUB_SHA" --title "TrackMySign $REL" --notes-file "$RUNNER_TEMP/notes.md" || true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REL="$GITHUB_REF_NAME"
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --verify-tag --title "TrackMySign $REL" --notes-file "$RUNNER_TEMP/notes.md" || true
          else
            REL=test-build
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --prerelease --target "$GITHUB_SHA" \
                --title "TrackMySign test build" --notes "Latest build from ${GITHUB_REF_NAME}. For testing only." || true
          fi
          cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
          gh release upload "$REL" "${{ matrix.artifact }}" --clobber

  desktop:
    name: Desktop app ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # assets and updater: bundle file (a glob) = release asset name.
        include:
          - name: Windows
            os: windows-latest
            rust-targets: ""
            build-args: --bundles nsis
            assets: target/release/bundle/nsis/*.exe=TrackMySign-Setup-windows-x64.exe
            # The updater runs the NSIS installer itself (passive mode).
            updater: target/release/bundle/nsis/*.exe=TrackMySign-Setup-windows-x64.exe
          - name: macOS
            os: macos-latest
            # One dmg for Apple Silicon and Intel Macs. Intel also matters on
            # Apple Silicon: a token driver shipped only as an x86_64 .dylib
            # loads if the app is started under Rosetta.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # "app" too: the updater archive (.app.tar.gz) is made from it.
            build-args: --bundles app,dmg --target universal-apple-darwin
            # The arm64 name is kept so existing download links keep working.
            assets: >-
              target/universal-apple-darwin/release/bundle/dmg/*.dmg=TrackMySign-macos-universal.dmg
              target/universal-apple-darwin/release/bundle/dmg/*.dmg=TrackMySign-macos-arm64.dmg
            updater: target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz=TrackMySign-macos-universal.app.tar.gz
          - name: Linux
            # Built against the oldest glibc of the supported runners, so the
            # AppImage and .deb run on newer distributions too.
            os: ubuntu-22.04
            rust-targets: ""
            build-args: --bundles appimage,deb
            assets: >-
              target/release/bundle/appimage/*.AppImage=TrackMySign-linux-x86_64.AppImage
              target/release/bundle/deb/*.deb=TrackMySign-linux-amd64.deb
            # A signed plain AppImage (no .tar.gz, which needs the updater's
            # zip feature); a .deb install updates through dpkg.
            updater: >-
              target/release/bundle/appimage/*.AppImage=TrackMySign-linux-x86_64.AppImage
              target/release/bundle/deb/*.deb=TrackMySign-linux-amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare config overrides
        shell: bash
        run: |
          # Forward slashes work for bash, PowerShell and the Tauri CLI alike.
          dir="${RUNNER_TEMP//\\//}/tauri-config"
          mkdir -p "$dir"
          echo "TAURI_CONFIG_DIR=$dir" >> "$GITHUB_ENV"

      # Tauri v2 prerequisites for Linux; patchelf and file for the AppImage.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      # ---- macOS: Developer ID signing + notarization, only once the secrets exist.
      # Tauri reads these exact variable names. APPLE_PASSWORD is an
      # app-specific password from account.apple.com, not the Apple ID password.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "$(printenv "$v")" ]; then
                echo "::warning::Secret $v is not set"
                continue
              fi
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Apple signing enabled (hardened runtime + entitlements.plist)"
          else
            # Ad-hoc signature: without one, macOS on Apple Silicon reports the
            # downloaded app as "damaged" instead of offering "Open Anyway".
            echo '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}' \
              > "$TAURI_CONFIG_DIR/20-macos-adhoc.json"
            echo "No Apple secrets set: building an ad-hoc signed, un-notarized app"
          fi

      # Retina dmg background: a two-resolution TIFF that Finder understands.
      - name: Prepare dmg background
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bg=apps/desktop/src-tauri/icons/installer
          tiffutil -cathidpicheck "$bg/dmg-background.png" "$bg/dmg-background@2x.png" \
            -out "$RUNNER_TEMP/dmg-background.tiff"
          printf '{"bundle":{"macOS":{"dmg":{"background":"%s"}}}}\n' "$RUNNER_TEMP/dmg-background.tiff" \
            > "$TAURI_CONFIG_DIR/10-dmg-background.json"

      # ---- Windows: optional Authenticode signing. Option A, Azure Trusted Signing
      # (Microsoft's "Artifact Signing"), used when all six AZURE_* secrets exist.
      - name: Configure Windows signing (Azure Trusted Signing)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ] \
             || [ -z "$AZURE_SIGNING_ENDPOINT" ] || [ -z "$AZURE_SIGNING_ACCOUNT" ] || [ -z "$AZURE_CERTIFICATE_PROFILE" ]; then
            echo "Azure Trusted Signing not configured"
            exit 0
          fi
          cargo install trusted-signing-cli --locked
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
            { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done
          jq -n --arg e "$AZURE_SIGNING_ENDPOINT" --arg a "$AZURE_SIGNING_ACCOUNT" --arg c "$AZURE_CERTIFICATE_PROFILE" \
            '{bundle:{windows:{signCommand:{cmd:"trusted-signing-cli",args:["-e",$e,"-a",$a,"-c",$c,"-d","TrackMySign","%1"]}}}}' \
            > "$TAURI_CONFIG_DIR/30-windows-sign.json"
          echo "WINDOWS_SIGNED=1" >> "$GITHUB_ENV"
          echo "Windows signing enabled (Azure Trusted Signing)"

      # Option B, a code-signing certificate exported as a .pfx file
      # (WINDOWS_CERTIFICATE = base64 of the .pfx). Used only if option A is not set.
      - name: Configure Windows signing (.pfx certificate)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNED != '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Output "No Windows signing secrets set: building an unsigned installer"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $cfg = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
            tsp = $true
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:TAURI_CONFIG_DIR "30-windows-sign.json") -Value $cfg -Encoding utf8NoBOM
          Write-Output "Windows signing enabled (certificate $($cert.Subject))"

      # ---- In-app updates: updater artifacts signed with the key whose public half
      # is in tauri.conf.json (plugins.updater.pubkey), only once the secret exists.
      - name: Configure updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No updater signing key set: building without update artifacts"
            exit 0
          fi
          for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
          done
          echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$TAURI_CONFIG_DIR/40-updater.json"
          echo "UPDATER_SIGNED=1" >> "$GITHUB_ENV"
          echo "Updater artifacts enabled"

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          # Tauri skips the Finder layout step (dmg background, icon positions)
          # when CI is set; the macOS runners can run it.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          npm ci
          args=()
          for f in "$TAURI_CONFIG_DIR"/*.json; do
            [ -e "$f" ] && args+=(--config "$f")
          done
          if npx tauri build ${{ matrix.build-args }} "${args[@]}"; then
            exit 0
          fi
          if [ "$RUNNER_OS" != "macOS" ]; then
            exit 1
          fi
          # Finder automation occasionally times out on hosted runners.
          echo "::warning::dmg layout step failed; retrying without the custom Finder layout"
          TAURI_BUNDLER_DMG_IGNORE_CI=false npx tauri build ${{ matrix.build-args }} "${args[@]}"

      # ---- Microsoft Store package (packaging/msstore): the app built again with
      # the store feature, packed as an MSIX. Unsigned: the Store signs it. A
      # failure here only shows as a warning, the installer is still published.
      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: apps/desktop
        shell: pwsh
        env:
          TRACKMYSIGN_STORE: "1"
        run: |
          npx tauri build --no-bundle --features store
          if ($LASTEXITCODE) { throw "tauri build failed" }
          ../../packaging/msstore/pack.ps1 -Exe ../../target/release/TrackMySign.exe `
            -Out ../../target/release/TrackMySign-windows-x64.msix
      # Tags (v1.2.3) publish a normal release, which /releases/latest points at;
      # other pushes refresh the "test-build" pre-release.
      - name: Publish release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash .github/release-notes.sh "${RELEASE_TAG:-$GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          if [[ -n "$RELEASE_TAG" ]]; then
            REL="$RELEASE_TAG"
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --target "$GITHUB_SHA" --title "TrackMySign $REL" --notes-file "$RUNNER_TEMP/notes.md" || true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REL="$GITHUB_REF_NAME"
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --verify-tag --title "TrackMySign $REL" --notes-file "$RUNNER_TEMP/notes.md" || true
          else
            REL=test-build
            gh release view "$REL" >/dev/null 2>&1 || \
              gh release create "$REL" --prerelease --target "$GITHUB_SHA" \
                --title "TrackMySign test build" --notes "Latest build from ${GITHUB_REF_NAME}. For testing only." || true
          fi
          for pair in ${{ matrix.assets }}; do
            asset="${pair#*=}"
            cp ${pair%%=*} "$asset"
            gh release upload "$REL" "$asset" --clobber
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -e target/release/TrackMySign-windows-x64.msix ]; then
              gh release upload "$REL" target/release/TrackMySign-windows-x64.msix --clobber
            else
              echo "::warning::No Microsoft Store package was built"
            fi
          fi
          if [ "$UPDATER_SIGNED" = "1" ]; then
            for pair in ${{ matrix.updater }}; do
              file="${pair%%=*}"
              u="${pair#*=}"
              files=("$u.sig")
              if [ ! -e "$u" ]; then
                cp $file "$u"
                files+=("$u")
              fi
              cp $file.sig "$u.sig"
              gh release upload "$REL" "${files[@]}" --clobber
            done
          fi

  # latest.json, which installed apps check for updates. Only for real releases:
  # test builds must never be offered as updates.
  updater-manifest:
    name: Update manifest
    needs: desktop
    if: github.event_name != 'pull_request' && (inputs.release_tag || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          REL="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir"
          win=TrackMySign-Setup-windows-x64.exe.sig
          mac=TrackMySign-macos-universal.app.tar.gz.sig
          appimage=TrackMySign-linux-x86_64.AppImage.sig
          deb=TrackMySign-linux-amd64.deb.sig
          gh release download "$REL" --dir "$dir" --clobber \
            --pattern "$win" --pattern "$mac" --pattern "$appimage" --pattern "$deb" || true
          for sig in "$win" "$mac" "$appimage" "$deb"; do
            if [ ! -e "$dir/$sig" ]; then
              echo "::warning::Release $REL has no $sig (TAURI_SIGNING_PRIVATE_KEY not set?); latest.json not published"
              exit 0
            fi
          done
          gh release view "$REL" --json body --jq .body > "$dir/notes.md"
          node apps/desktop/scripts/updater-manifest.mjs --tag "$REL" --repo "$GITHUB_REPOSITORY" \
            --windows-sig "$dir/$win" --macos-sig "$dir/$mac" \
            --appimage-sig "$dir/$appimage" --deb-sig "$dir/$deb" \
            --notes-file "$dir/notes.md" --out latest.json
          gh release upload "$REL" latest.json --clobber

  # winget (microsoft/winget-pkgs): a pull request adding each real release, once
  # the package is in winget-pkgs and the WINGET_TOKEN secret exists (a classic
  # token with the public_repo scope, of an account with a fork of winget-pkgs).
  # The first version goes in by hand, see packaging/winget/README.md.
  winget:
    name: winget
    needs: desktop
    if: github.event_name != 'pull_request' && (inputs.release_tag || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          REL="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          dir="$RUNNER_TEMP/winget"
          gh release download "$REL" --dir "$dir" --pattern TrackMySign-Setup-windows-x64.exe
          date="$(gh release view "$REL" --json publishedAt --jq '.publishedAt[:10]')"
          pip install --break-system-packages jsonschema pyyaml
          python3 packaging/winget/manifest.py generate --version "$REL" \
            --installer "$dir/TrackMySign-Setup-windows-x64.exe" --release-date "$date" --out "$dir/manifests"
          python3 packaging/winget/manifest.py validate "$dir/manifests"
          echo "WINGET_REL=$REL" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget/manifests
      - name: Open winget-pkgs pull request
        if: env.WINGET_TOKEN != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/komac.tar.gz" \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  $RUNNER_TEMP/komac.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/komac.tar.gz" -C "$RUNNER_TEMP" komac
          komac="$RUNNER_TEMP/komac"
          id=TrackMyTech.TrackMySign
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/t/TrackMyTech/TrackMySign)"
          if [ "$code" = 404 ]; then
            echo "::notice::$id is not in winget-pkgs yet; submit the first version by hand (packaging/winget/README.md)"
            exit 0
          elif [ "$code" != 200 ]; then
            echo "::error::GitHub answered $code for winget-pkgs (WINGET_TOKEN expired?)"
            exit 1
          fi
          # The manifests generated above, not `komac update`: that would copy the
          # previous version's Apps & Features entry (publisher, display name).
          ver="${WINGET_REL#v}"
          "$komac" submit "$RUNNER_TEMP/winget/manifests/t/TrackMyTech/TrackMySign/$ver" --yes
      - name: Skip winget submission
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN not set; manifests generated and validated, nothing submitted"
